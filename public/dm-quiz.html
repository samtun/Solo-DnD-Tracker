<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM Quiz</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .hero,
        .quiz-card,
        .side-panel {
            background: rgba(255, 250, 242, .88);
        }

        .hero {
            padding: 48px clamp(24px, 6vw, 74px);
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            margin: 10px 0 16px;
            max-width: 680px;
            font-size: clamp(42px, 7vw, 82px);
            line-height: .93;
            font-weight: 500;
        }

        .hero p {
            max-width: 570px;
            color: #4f5b5d;
            font-size: 18px;
            line-height: 1.55;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .primary {
            color: #fff;
            background: var(--teal);
        }

        .primary:hover {
            background: #095c59;
        }

        .side-panel {
            padding: 22px;
        }

        .side-panel h2 {
            margin: 4px 0 16px;
            font-size: 20px;
        }

        .side-panel p {
            color: var(--muted);
            line-height: 1.5;
            font-size: 14px;
        }

        .rules {
            border-top: 1px solid var(--line);
            margin-top: 20px;
            padding-top: 16px;
        }

        .rules strong {
            color: var(--coral);
        }

        .quiz-card {
            padding: clamp(22px, 5vw, 56px);
        }

        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 20px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 18px;
            margin-bottom: 32px;
        }

        .progress {
            color: var(--muted);
            font: 700 13px 'Trebuchet MS', sans-serif;
        }

        .difficulty {
            color: #fff;
            background: var(--coral);
            padding: 8px 11px;
            border-radius: 2px;
            font: 700 12px 'Trebuchet MS', sans-serif;
            text-transform: uppercase;
            letter-spacing: .08em;
            white-space: nowrap;
        }

        .question {
            font-size: clamp(28px, 4vw, 48px);
            line-height: 1.08;
            margin: 0 0 30px;
            font-weight: 500;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .choice {
            display: flex;
            align-items: stretch;
            gap: 14px;
            text-align: left;
            color: var(--ink);
            background: #f3eadc;
            border: 1px solid var(--line);
            font: 18px Georgia, serif;
            min-height: 64px;
        }

        .choice-label {
            display: flex;
            align-items: center;
            flex: 0 0 34px;
            justify-content: center;
            margin: -11px 0 -11px -16px;
            color: #8e806d;
            background: #e7d9c5;
            font: 700 14px 'Trebuchet MS', sans-serif;
        }

        .choice-text {
            align-self: center;
            font-weight: 400;
        }

        .choice:disabled {
            opacity: 1;
            cursor: default;
        }

        .choice:disabled:hover {
            background: #f3eadc;
            border-color: var(--line);
        }

        .choice.selected:disabled,
        .choice.selected:disabled:hover {
            background: #d7ece7;
            border-color: var(--teal);
        }

        .choice:hover,
        .choice.selected {
            background: #d7ece7;
            border-color: var(--teal);
        }

        .answer-form {
            display: flex;
            gap: 10px;
        }

        .answer-form input {
            flex: 1;
            min-width: 0;
            border: 1px solid var(--line);
            background: #fff;
            padding: 16px;
            font: 18px Georgia, serif;
            color: var(--ink);
        }

        .feedback {
            min-height: 30px;
            margin-top: 22px;
            font: 700 15px 'Trebuchet MS', sans-serif;
        }

        #continue-button {
            margin-top: 8px;
        }

        .correct {
            color: var(--teal);
        }

        .incorrect {
            color: var(--coral);
        }

        @media (max-width:760px) {

            .side-panel {
                order: -1;
            }

            .hero {
                min-height: 420px;
            }

            .choices {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width:500px) {
            .answer-form {
                flex-direction: column;
            }
        }
    </style>
</head>

        ];

        const SESSION_LENGTH = 30;
        const HIGH_SCORE_KEY = 'soloDndQuizHighScores';
        const SESSION_STATE_KEY = 'soloDndQuizSession';
        let session = [], questionIndex = 0, sessionScore = 0, acceptingAnswer = false;

        const $ = id => document.getElementById(id);

        function updateTotal() {
            $('total-score').textContent = sessionScore.toLocaleString();
        }

        function saveSessionState() {
            localStorage.setItem(SESSION_STATE_KEY, JSON.stringify({ session, questionIndex, nextQuestionId: session[questionIndex]?.id || null, sessionScore }));
        }

        function clearSessionState() {
            localStorage.removeItem(SESSION_STATE_KEY);
        }

        function loadSessionState() {
            try {
                const saved = JSON.parse(localStorage.getItem(SESSION_STATE_KEY));
                if (!saved || !Array.isArray(saved.session) || saved.session.length === 0) {
                    console.log('Failed to load session state: No saved session found');
                    return false;
                }

                const restoredSession = saved.session.map(savedQuestion => {
                    const source = questions.find(question => question.id === savedQuestion.id);
                    return source ? { ...source, ...savedQuestion, options: [...source.options] } : null;
                });

                if (restoredSession.some(question => !question?.options || question.answer === undefined)) {
                    console.error('Failed to load session state: Incomplete question data');
                    return false;
                }

                const savedIndex = Number(saved.questionIndex);
                if (!Number.isInteger(savedIndex) || savedIndex < 0 || savedIndex > restoredSession.length) {
                    console.error('Failed to load session state: Invalid question index');
                    return false;
                }
                if (saved.nextQuestionId && savedIndex < restoredSession.length && restoredSession[savedIndex]?.id !== saved.nextQuestionId) {
                    console.error('Failed to load session state: Mismatched question ID');
                    return false;
                }

                const usedIds = new Set(restoredSession.map(question => question.id));
                const remainingQuestions = shuffle(questions.filter(question => !usedIds.has(question.id)));
                while (restoredSession.length < SESSION_LENGTH && remainingQuestions.length > 0) {
                    const question = remainingQuestions.shift();
                    restoredSession.push({ ...question, options: [...question.options] });
                }
                if (restoredSession.length !== SESSION_LENGTH) {
                    console.error('Failed to load session state: Incomplete session');
                    return false;
                }

                session = restoredSession;
                questionIndex = savedIndex;
                sessionScore = Number(saved.sessionScore) || 0;
                saveSessionState();
                console.log(`Loaded session state with ${session.length} questions, index ${questionIndex}, score ${sessionScore}`);
                return true;
            } catch (error) {
                console.error('Failed to load session state due to error:', error);
                clearSessionState();
                return false;
            }
        }

        function updateStartButton() {
            $('start-button').textContent = localStorage.getItem(SESSION_STATE_KEY) ? 'Resume quiz' : 'Start quiz';
        }

        function shuffle(items) {
            return [...items].sort(() => Math.random() - 0.5);
        }

        function buildSession() {
            const quotas = { 1: 5, 2: 5, 3: 5, 4: 5, 5: 5, 6: 5 };
            return shuffle(Object.entries(quotas).flatMap(([difficulty, count]) => shuffle(questions.filter(q => q.difficulty === Number(difficulty))).slice(0, count)));
        }

        function renderQuestion() {
            const current = session[questionIndex]; acceptingAnswer = true;
            $('progress').textContent = `Question ${questionIndex + 1} of ${SESSION_LENGTH}`;
            $('difficulty').textContent = `Difficulty ${current.difficulty} / 6`;
            $('question').textContent = current.question;
            $('feedback').textContent = '';
            $('feedback').className = 'feedback';
            $('continue-button').classList.add('hidden');
            $('choices').innerHTML = '';
            shuffle(current.options).forEach((option, index) => {
                const button = document.createElement('button');
                const label = document.createElement('span');
                const text = document.createElement('span');
                button.className = 'choice';
                button.type = 'button';
                label.className = 'choice-label';
                label.textContent = String.fromCharCode(65 + index);
                text.className = 'choice-text';
                text.textContent = option;
                button.append(label, text);
                button.onclick = () => grade(option, button);
                $('choices').appendChild(button);
            });
        }

        function grade(answer, selectedButton) {
            if (!acceptingAnswer) return;

            acceptingAnswer = false;
            const current = session[questionIndex];
            const correct = answer === current.options[current.answer];
            const earned = correct ? current.difficulty * 100 : 0;
            sessionScore += earned; updateTotal(); questionIndex += 1;
            saveSessionState();
            selectedButton.classList.add('selected');
            document.querySelectorAll('.choice').forEach(button => button.disabled = true);
            $('feedback').textContent = correct ? `Correct. +${earned}` : `Incorrect. Correct answer: ${current.options[current.answer]}`;
            $('feedback').classList.add(correct ? 'correct' : 'incorrect');
            $('continue-button').classList.remove('hidden');
        }

        function nextQuestion() {
            if (questionIndex >= SESSION_LENGTH) {
                return finishSession();
            }

            saveSessionState();
            renderQuestion();
        }

        function finishSession() {
            const completedScore = sessionScore;
            const scores = JSON.parse(localStorage.getItem(HIGH_SCORE_KEY) || '[]');
            scores.push({ score: completedScore, date: new Date().toISOString() });
            scores.sort((a, b) => b.score - a.score);
            localStorage.setItem(HIGH_SCORE_KEY, JSON.stringify(scores.slice(0, 10)));
            clearSessionState();
            sessionScore = 0;
            $('quiz-screen').classList.add('hidden');
            $('start-screen').classList.remove('hidden');
            $('start-button').textContent = `Play again (${completedScore.toLocaleString()} session points)`;
            updateTotal();
        }

        $('start-button').addEventListener('click', () => {
            if (!loadSessionState()) {
                console.log('Starting new session');
                session = buildSession();
                questionIndex = 0;
                sessionScore = 0;
                saveSessionState();
            }

            $('start-screen').classList.add('hidden');
            $('quiz-screen').classList.remove('hidden');
            if (questionIndex >= SESSION_LENGTH) {
                finishSession();
            } else {
                renderQuestion();
            }
        });

        $('continue-button').addEventListener('click', nextQuestion);
        document.addEventListener('keydown', event => {
            const key = event.key.toLowerCase();
            const choiceIndex = /^[1-4]$/.test(key) ? Number(key) - 1 : 'abcd'.indexOf(key);

            if (acceptingAnswer && choiceIndex >= 0) {
                const choiceButton = document.querySelectorAll('.choice')[choiceIndex];
                if (choiceButton) {
                    event.preventDefault();
                    choiceButton.click();
                }
                return;
            }

            if (!acceptingAnswer && key === 'enter' && !$('continue-button').classList.contains('hidden')) {
                event.preventDefault();
                $('continue-button').click();
            }
        });
        $('start-button').disabled = false;
        updateStartButton();
        updateTotal();
    </script>
