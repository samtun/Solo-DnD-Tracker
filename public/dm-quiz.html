<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM Quiz</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .hero,
        .quiz-card,
        .side-panel {
            background: rgba(255, 250, 242, .88);
        }

        .hero {
            padding: 48px clamp(24px, 6vw, 74px);
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            margin: 10px 0 16px;
            max-width: 680px;
            font-size: clamp(42px, 7vw, 82px);
            line-height: .93;
            font-weight: 500;
        }

        .hero p {
            max-width: 570px;
            color: #4f5b5d;
            font-size: 18px;
            line-height: 1.55;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .primary {
            color: #fff;
            background: var(--teal);
        }

        .primary:hover {
            background: #095c59;
        }

        .side-panel {
            padding: 22px;
        }

        .side-panel h2 {
            margin: 4px 0 16px;
            font-size: 20px;
        }

        .side-panel p {
            color: var(--muted);
            line-height: 1.5;
            font-size: 14px;
        }

        .rules {
            border-top: 1px solid var(--line);
            margin-top: 20px;
            padding-top: 16px;
        }

        .rules strong {
            color: var(--coral);
        }

        .quiz-card {
            padding: clamp(22px, 5vw, 56px);
        }

        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 20px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 18px;
            margin-bottom: 32px;
        }

        .progress {
            color: var(--muted);
            font: 700 13px 'Trebuchet MS', sans-serif;
        }

        .difficulty {
            color: #fff;
            background: var(--coral);
            padding: 8px 11px;
            border-radius: 2px;
            font: 700 12px 'Trebuchet MS', sans-serif;
            text-transform: uppercase;
            letter-spacing: .08em;
            white-space: nowrap;
        }

        .question {
            font-size: clamp(28px, 4vw, 48px);
            line-height: 1.08;
            margin: 0 0 30px;
            font-weight: 500;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .choice {
            display: flex;
            align-items: stretch;
            gap: 14px;
            text-align: left;
            color: var(--ink);
            background: #f3eadc;
            border: 1px solid var(--line);
            font: 18px Georgia, serif;
            min-height: 64px;
        }

        .choice-label {
            display: flex;
            align-items: center;
            flex: 0 0 34px;
            justify-content: center;
            margin: -11px 0 -11px -16px;
            color: #8e806d;
            background: #e7d9c5;
            font: 700 14px 'Trebuchet MS', sans-serif;
        }

        .choice-text {
            align-self: center;
            font-weight: 400;
        }

        .choice:disabled {
            opacity: 1;
            cursor: default;
        }

        .choice:disabled:hover {
            background: #f3eadc;
            border-color: var(--line);
        }

        .choice.selected:disabled,
        .choice.selected:disabled:hover {
            background: #d7ece7;
            border-color: var(--teal);
        }

        .choice:hover,
        .choice.selected {
            background: #d7ece7;
            border-color: var(--teal);
        }

        .answer-form {
            display: flex;
            gap: 10px;
        }

        .answer-form input {
            flex: 1;
            min-width: 0;
            border: 1px solid var(--line);
            background: #fff;
            padding: 16px;
            font: 18px Georgia, serif;
            color: var(--ink);
        }

        .feedback {
            min-height: 30px;
            margin-top: 22px;
            font: 700 15px 'Trebuchet MS', sans-serif;
        }

        #continue-button {
            margin-top: 8px;
        }

        .correct {
            color: var(--teal);
        }

        .incorrect {
            color: var(--coral);
        }

        @media (max-width:760px) {

            .side-panel {
                order: -1;
            }

            .hero {
                min-height: 420px;
            }

            .choices {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width:500px) {
            .answer-form {
                flex-direction: column;
            }
        }
    </style>
</head>

<body class="quiz-page">
    <div class="shell">
        <header>
            <div class="brand">DM Quiz</div>
            <nav>
                <a href="leaderboard.html">Leaderboard</a>
            </nav>
            <div class="score"><small>Total points</small><strong id="total-score">0</strong></div>
        </header>
        <main>
            <section id="start-screen" class="hero"><span class="eyebrow">30 questions / one table</span>
                <h1>How sharp is your DM seat?</h1>
                <p>Warm up the rules knowledge, test your judgment, and see how far your table instincts carry you.</p>
                <div class="hero-actions"><button id="start-button" class="primary" disabled>Loading
                        questions...</button></div>
            </section>
            <section id="quiz-screen" class="quiz-card hidden">
                <div class="quiz-top">
                    <div id="progress" class="progress">Question 1 of 30</div>
                    <div id="difficulty" class="difficulty">Difficulty 1 / 6</div>
                </div>
                <h2 id="question" class="question"></h2>
                <div id="choices" class="choices"></div>
                <div id="feedback" class="feedback" aria-live="polite"></div>
                <button id="continue-button" class="primary hidden" type="button">Continue</button>
            </section>
        </main>
    </div>
    <script>
        const questions = [
            { "id": "s1", "difficulty": 1, "question": "How many sides does a standard d20 have?", "options": ["6", "8", "20", "100"], "answer": 2 },
            { "id": "s2", "difficulty": 1, "question": "How far can a level 1 character move per turn by default?", "options": ["10 ft", "20 ft", "30 ft", "60 ft"], "answer": 2 },
            { "id": "s3", "difficulty": 1, "question": "Which die is most commonly used for a weapon attack roll?", "options": ["d4", "d6", "d20", "d100"], "answer": 2 },
            { "id": "s4", "difficulty": 1, "question": "Which ability score is associated with a fighter's physical power?", "options": ["Strength", "Wisdom", "Charisma", "Intelligence"], "answer": 0 },
            { "id": "s5", "difficulty": 1, "question": "How many actions does a character normally get on their turn?", "options": ["None", "1", "2", "3"], "answer": 1 },
            { "id": "s6", "difficulty": 1, "question": "What does AC stand for?", "options": ["Action Check", "Armor Class", "Attack Charge", "Arcane Control"], "answer": 1 },
            { "id": "s7", "difficulty": 1, "question": "Which ability score is used for a typical Wisdom saving throw?", "options": ["Strength", "Dexterity", "Wisdom", "Charisma"], "answer": 2 },
            { "id": "s8", "difficulty": 1, "question": "How many feet are in one square of a standard combat grid?", "options": ["1 foot", "5 feet", "10 feet", "15 feet"], "answer": 1 },
            { "id": "s9", "difficulty": 1, "question": "Which action usually allows a creature to move up to its speed?", "options": ["Dash", "Help", "Search", "Ready"], "answer": 0 },
            { "id": "m1", "difficulty": 2, "question": "Which spell is used for healing?", "options": ["Healing Word", "Guidance", "Fire Bolt", "Magic Missile"], "answer": 0 },
            { "id": "m2", "difficulty": 2, "question": "What bonus is added to a d20 roll when a character is proficient with a skill?", "options": ["Proficiency bonus", "Armor bonus", "Spell bonus", "Level bonus"], "answer": 0 },
            { "id": "m3", "difficulty": 2, "question": "Which condition prevents a creature from taking actions or reactions?", "options": ["Charmed", "Grappled", "Incapacitated", "Prone"], "answer": 2 },
            { "id": "m4", "difficulty": 2, "question": "What is the range of a normal melee weapon attack?", "options": ["5 feet", "15 feet", "30 feet", "60 feet"], "answer": 0 },
            { "id": "m5", "difficulty": 2, "question": "What does a natural 20 on a weapon attack usually do?", "options": ["Miss automatically", "Deal a critical hit", "End the encounter", "Grant another action"], "answer": 1 },
            { "id": "m6", "difficulty": 2, "question": "Which class prepares spells using Wisdom?", "options": ["Wizard", "Cleric", "Bard", "Sorcerer"], "answer": 1 },
            { "id": "m7", "difficulty": 2, "question": "What type of damage does a typical longsword deal when used one-handed?", "options": ["1d4 slashing", "1d6 piercing", "1d8 slashing", "1d10 bludgeoning"], "answer": 2 },
            { "id": "m8", "difficulty": 2, "question": "Which condition gives a creature disadvantage on attack rolls and ability checks?", "options": ["Charmed", "Frightened", "Invisible", "Unconscious"], "answer": 1 },
            { "id": "m9", "difficulty": 2, "question": "What does the Dash action grant?", "options": ["An extra action", "Extra movement equal to your speed", "Advantage on attacks", "Temporary hit points"], "answer": 1 },
            { "id": "c1", "difficulty": 3, "question": "A frightened creature has disadvantage on what while the source is visible?", "options": ["Attack rolls and ability checks", "Saving throws only", "Armor Class", "Initiative rolls"], "answer": 0 },
            { "id": "c2", "difficulty": 3, "question": "How long does a standard round of combat represent?", "options": ["1 second", "6 seconds", "30 seconds", "1 minute"], "answer": 1 },
            { "id": "c3", "difficulty": 3, "question": "What can a rogue use to deal Sneak Attack damage?", "options": ["Any spell", "A finesse or ranged weapon", "Only a greatsword", "Only an unarmed strike"], "answer": 1 },
            { "id": "c4", "difficulty": 3, "question": "What happens when a creature reaches 0 hit points?", "options": ["It is always dead", "It falls unconscious if it is not killed outright", "It gains temporary hit points", "It immediately takes a long rest"], "answer": 1 },
            { "id": "c5", "difficulty": 3, "question": "What kind of check is used to sneak past a guard?", "options": ["Athletics", "Insight", "Stealth", "Medicine"], "answer": 2 },
            { "id": "c6", "difficulty": 3, "question": "Which action lets you prepare a response to a future trigger?", "options": ["Dash", "Ready", "Help", "Search"], "answer": 1 },
            { "id": "c7", "difficulty": 3, "question": "What is the normal duration of the poisoned condition?", "options": ["Always 1 minute", "Always 1 hour", "It depends on the effect that caused it", "Until the next long rest"], "answer": 2 },
            { "id": "c8", "difficulty": 3, "question": "Which ability check is normally used to recall lore about a monster?", "options": ["History", "Acrobatics", "Animal Handling", "Sleight of Hand"], "answer": 0 },
            { "id": "c9", "difficulty": 3, "question": "What happens when a creature takes the Hide action successfully?", "options": ["It becomes invisible to all creatures", "It makes a Dexterity (Stealth) check to hide", "It gains resistance to damage", "It can immediately move twice its speed"], "answer": 1 },
            { "id": "a1", "difficulty": 4, "question": "A spellcaster is concentrating when they take damage. What do they make?", "options": ["A death save", "A concentration Constitution save", "An initiative check", "A Charisma check"], "answer": 1 },
            { "id": "a2", "difficulty": 4, "question": "What is the usual maximum number of death saving throw successes needed to stabilize?", "options": ["1", "2", "3", "5"], "answer": 2 },
            { "id": "a3", "difficulty": 4, "question": "What does a grappled creature's speed become?", "options": ["0", "5 feet", "Half speed", "It doubles"], "answer": 0 },
            { "id": "a4", "difficulty": 4, "question": "Which spell is a classic reaction used to negate another spell?", "options": ["Counterspell", "Bless", "Misty Step", "Detect Magic"], "answer": 0 },
            { "id": "a5", "difficulty": 4, "question": "What does cover primarily improve?", "options": ["Hit points", "Armor Class and Dexterity saves", "Spell slots", "Movement speed"], "answer": 1 },
            { "id": "a6", "difficulty": 4, "question": "What is the name for the distance a creature can jump with a running start?", "options": ["Long jump", "High jump", "Bounded leap", "Dash jump"], "answer": 0 },
            { "id": "a7", "difficulty": 4, "question": "What does the blinded condition cause for a creature's attack rolls?", "options": ["Advantage", "Disadvantage", "No change", "Automatic failure"], "answer": 1 },
            { "id": "a8", "difficulty": 4, "question": "A wizard uses Arcane Recovery. What limits the spell slots they can regain?", "options": ["The total levels of the slots cannot exceed half the wizard's level, rounded up", "They can regain only one slot of any level", "They can regain every expended slot", "They can regain only 1st-level slots"], "answer": 0 },
            { "id": "a9", "difficulty": 4, "question": "What does three-quarters cover provide to the protected target?", "options": ["+2 AC and Dexterity saves", "+5 AC and Dexterity saves", "Resistance to all damage", "Advantage on all saving throws"], "answer": 1 },
            { "id": "e1", "difficulty": 5, "question": "A creature is invisible. What does attacking it normally impose?", "options": ["Advantage", "Disadvantage", "No roll", "Automatic critical hit"], "answer": 1 },
            { "id": "e2", "difficulty": 5, "question": "What type of action is used to stabilize an adjacent unconscious creature with a healer's kit?", "options": ["Action", "Bonus action", "Reaction", "Free action"], "answer": 0 },
            { "id": "e3", "difficulty": 5, "question": "What does the restrained condition impose?", "options": ["Advantage on attacks against the target and disadvantage for it", "Only speed 0", "Disadvantage on attacks and Dexterity saves, and attacks against it have advantage", "It cannot speak"], "answer": 2 },
            { "id": "e4", "difficulty": 5, "question": "When does a held spell require a concentration check?", "options": ["When the caster takes damage", "Every six seconds", "When the caster speaks", "Never"], "answer": 0 },
            { "id": "e5", "difficulty": 5, "question": "What is the name of the rule that lets a character use a reaction to reduce incoming damage?", "options": ["Evasion", "Uncanny Dodge", "Second Wind", "Deflect Missiles"], "answer": 1 },
            { "id": "e6", "difficulty": 5, "question": "Which save most often resists a dragon's breath weapon?", "options": ["Strength", "Dexterity", "Intelligence", "Charisma"], "answer": 1 },
            { "id": "e7", "difficulty": 5, "question": "What happens when a concentrating spellcaster becomes incapacitated?", "options": ["Concentration is automatically maintained", "Concentration ends", "The spell becomes permanent", "The spell is cast again"], "answer": 1 },
            { "id": "e8", "difficulty": 5, "question": "What is a key effect of the stunned condition?", "options": ["The creature can take only a bonus action", "The creature is incapacitated, can't move, and can speak only falteringly", "The creature is invisible", "The creature automatically fails Strength saves only"], "answer": 1 },
            { "id": "e9", "difficulty": 5, "question": "When a creature is prone, which attack rolls against it have advantage?", "options": ["Only ranged attacks", "Only melee attacks from within 5 feet", "All attacks", "None"], "answer": 1 },
            { "id": "x1", "difficulty": 6, "question": "A monster has legendary actions. When can it use them?", "options": ["Only on its own turn", "At the end of another creature's turn", "Only before initiative", "Only after a short rest"], "answer": 1 },
            { "id": "x2", "difficulty": 6, "question": "What happens to a spell requiring concentration when the caster becomes incapacitated?", "options": ["The spell ends", "The spell doubles", "The spell pauses", "The spell targets the caster"], "answer": 0 },
            { "id": "x3", "difficulty": 6, "question": "What is the key difference between a spell attack roll and a spell save?", "options": ["The target rolls for a spell attack", "The caster rolls for a spell attack; the target rolls the save", "They are identical", "Neither can miss"], "answer": 1 },
            { "id": "x4", "difficulty": 6, "question": "A creature has resistance to a damage type. What happens to damage of that type?", "options": ["It is doubled", "It is halved, rounded down", "It is ignored completely", "It becomes healing"], "answer": 1 },
            { "id": "x5", "difficulty": 6, "question": "What kind of rest normally restores all spent Hit Dice?", "options": ["Short rest", "Long rest", "Breather", "Meditation"], "answer": 1 },
            { "id": "x6", "difficulty": 6, "question": "What must a creature do to end the frightened condition caused by a spell?", "options": ["Move closer to the source", "Succeed on the spell's specified save or meet its ending condition", "Drop to 0 hit points", "Use a bonus action"], "answer": 1 },
            { "id": "x7", "difficulty": 6, "question": "How does a creature normally escape a grapple?", "options": ["It must use a reaction", "It makes a Strength (Athletics) or Dexterity (Acrobatics) check contested by the grappler's Athletics check", "It automatically escapes at the end of its turn", "It makes a Wisdom saving throw"], "answer": 1 },
            { "id": "x8", "difficulty": 6, "question": "What does a critical hit let you do with the attack's damage dice?", "options": ["Reroll all dice once", "Roll all of the attack's damage dice twice and add the modifiers normally", "Double the final damage after modifiers", "Ignore the target's resistance"], "answer": 1 },
            { "id": "x9", "difficulty": 6, "question": "What is required to cast a spell as a ritual?", "options": ["The spell must have the ritual tag and the caster must have the feature and access required to cast rituals", "A spell slot one level higher", "A successful Arcana check", "A reaction"], "answer": 0 }
        ];

        const SESSION_LENGTH = 30;
        const HIGH_SCORE_KEY = 'soloDndQuizHighScores';
        const SESSION_STATE_KEY = 'soloDndQuizSession';
        let session = [], questionIndex = 0, sessionScore = 0, acceptingAnswer = false;

        const $ = id => document.getElementById(id);

        function updateTotal() {
            $('total-score').textContent = sessionScore.toLocaleString();
        }

        function saveSessionState() {
            localStorage.setItem(SESSION_STATE_KEY, JSON.stringify({ session, questionIndex, nextQuestionId: session[questionIndex]?.id || null, sessionScore }));
        }

        function clearSessionState() {
            localStorage.removeItem(SESSION_STATE_KEY);
        }

        function loadSessionState() {
            try {
                const saved = JSON.parse(localStorage.getItem(SESSION_STATE_KEY));
                if (!saved || !Array.isArray(saved.session) || saved.session.length === 0) return false;

                const restoredSession = saved.session.map(savedQuestion => {
                    const source = questions.find(question => question.id === savedQuestion.id);
                    return source ? { ...source, ...savedQuestion, options: [...source.options] } : null;
                });
                if (restoredSession.some(question => !question?.options || question.answer === undefined)) return false;

                const savedIndex = Number(saved.questionIndex);
                if (!Number.isInteger(savedIndex) || savedIndex < 0 || savedIndex > restoredSession.length) return false;
                if (saved.nextQuestionId && savedIndex < restoredSession.length && restoredSession[savedIndex]?.id !== saved.nextQuestionId) return false;

                const usedIds = new Set(restoredSession.map(question => question.id));
                const remainingQuestions = shuffle(questions.filter(question => !usedIds.has(question.id)));
                while (restoredSession.length < SESSION_LENGTH && remainingQuestions.length > 0) {
                    const question = remainingQuestions.shift();
                    restoredSession.push({ ...question, options: [...question.options] });
                }
                if (restoredSession.length !== SESSION_LENGTH) return false;

                session = restoredSession;
                questionIndex = savedIndex;
                sessionScore = Number(saved.sessionScore) || 0;
                saveSessionState();
                return true;
            } catch {
                clearSessionState();
                return false;
            }
        }

        function updateStartButton() {
            $('start-button').textContent = localStorage.getItem(SESSION_STATE_KEY) ? 'Resume quiz' : 'Start quiz';
        }

        function shuffle(items) {
            return [...items].sort(() => Math.random() - 0.5);
        }

        function buildSession() {
            const quotas = { 1: 9, 2: 9, 3: 9, 4: 9, 5: 9, 6: 9 };
            return shuffle(Object.entries(quotas).flatMap(([difficulty, count]) => shuffle(questions.filter(q => q.difficulty === Number(difficulty))).slice(0, count)));
        }

        function renderQuestion() {
            const current = session[questionIndex]; acceptingAnswer = true;
            $('progress').textContent = `Question ${questionIndex + 1} of ${SESSION_LENGTH}`;
            $('difficulty').textContent = `Difficulty ${current.difficulty} / 6`;
            $('question').textContent = current.question;
            $('feedback').textContent = '';
            $('feedback').className = 'feedback';
            $('continue-button').classList.add('hidden');
            $('choices').innerHTML = '';
            shuffle(current.options).forEach((option, index) => {
                const button = document.createElement('button');
                const label = document.createElement('span');
                const text = document.createElement('span');
                button.className = 'choice';
                button.type = 'button';
                label.className = 'choice-label';
                label.textContent = String.fromCharCode(65 + index);
                text.className = 'choice-text';
                text.textContent = option;
                button.append(label, text);
                button.onclick = () => grade(option, button);
                $('choices').appendChild(button);
            });
        }

        function grade(answer, selectedButton) {
            if (!acceptingAnswer) return;

            acceptingAnswer = false;
            const current = session[questionIndex];
            const correct = answer === current.options[current.answer];
            const earned = correct ? current.difficulty * 100 : 0;
            sessionScore += earned; updateTotal(); questionIndex += 1;
            saveSessionState();
            selectedButton.classList.add('selected');
            document.querySelectorAll('.choice').forEach(button => button.disabled = true);
            $('feedback').textContent = correct ? `Correct. +${earned}` : `Incorrect. Correct answer: ${current.options[current.answer]}`;
            $('feedback').classList.add(correct ? 'correct' : 'incorrect');
            $('continue-button').classList.remove('hidden');
        }

        function nextQuestion() {
            if (questionIndex >= SESSION_LENGTH) {
                return finishSession();
            }

            saveSessionState();
            renderQuestion();
        }

        function finishSession() {
            const completedScore = sessionScore;
            const scores = JSON.parse(localStorage.getItem(HIGH_SCORE_KEY) || '[]');
            scores.push({ score: completedScore, date: new Date().toISOString() });
            scores.sort((a, b) => b.score - a.score);
            localStorage.setItem(HIGH_SCORE_KEY, JSON.stringify(scores.slice(0, 10)));
            clearSessionState();
            sessionScore = 0;
            $('quiz-screen').classList.add('hidden');
            $('start-screen').classList.remove('hidden');
            $('start-button').textContent = `Play again (${completedScore.toLocaleString()} session points)`;
            updateTotal();
        }

        $('start-button').addEventListener('click', () => {
            if (!loadSessionState()) {
                session = buildSession();
                questionIndex = 0;
                sessionScore = 0;
                saveSessionState();
            }

            $('start-screen').classList.add('hidden');
            $('quiz-screen').classList.remove('hidden');
            if (questionIndex >= SESSION_LENGTH) {
                finishSession();
            } else {
                renderQuestion();
            }
        });

        $('continue-button').addEventListener('click', nextQuestion);
        $('start-button').disabled = false;
        updateStartButton();
        updateTotal();
    </script>
</body>

</html>
