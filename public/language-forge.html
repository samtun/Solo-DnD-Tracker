<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f6f0e5">
	<title>Language Forge | Solo DnD Tracker</title>
	<link rel="stylesheet" href="styles.css">
	<style>
		.shell {
			width: min(100% - 32px, 1120px);
		}

		.page-heading {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 24px;
			margin: 15px 0 34px;
		}

		.page-heading h1 {
			margin: 9px 0 0;
			font-size: clamp(42px, 7vw, 72px);
		}

		.page-heading p {
			max-width: 390px;
			margin: 0 0 4px;
			color: #4f5b5d;
			font-size: 16px;
			line-height: 1.55;
		}

		.workbench {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 310px;
			gap: 24px;
			align-items: start;
		}

		.generator,
		.dictionary {
			background: rgba(255, 250, 242, .92);
			border: 1px solid var(--line);
			box-shadow: 0 12px 30px rgba(44, 48, 40, .08);
		}

		.generator {
			padding: clamp(22px, 4vw, 42px);
		}

		.section-head {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: 16px;
			padding-bottom: 15px;
			border-bottom: 1px solid var(--line);
		}

		.section-head h2,
		.dictionary h2 {
			margin: 0;
			font-size: 24px;
			font-weight: 500;
		}

		.section-head span,
		.field label,
		.slider-label,
		.dictionary-tools label {
			color: var(--muted);
			font: 700 11px 'Trebuchet MS', sans-serif;
			letter-spacing: .1em;
			text-transform: uppercase;
		}

		.fields {
			display: grid;
			grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
			gap: 18px;
			margin: 25px 0 22px;
		}

		.field {
			display: grid;
			gap: 8px;
		}

		.field input,
		.field select,
		.dictionary-tools select,
		.dictionary-tools input {
			width: 100%;
			min-width: 0;
			min-height: 46px;
			padding: 10px 12px;
			color: var(--ink);
			background: #fffdf8;
			border: 1px solid var(--line);
			border-radius: 2px;
			font: 16px Georgia, serif;
		}

		.field input:focus,
		.field select:focus,
		.dictionary-tools select:focus,
		.dictionary-tools input:focus {
			outline: 2px solid rgba(15, 119, 116, .35);
			border-color: var(--teal);
		}

		.field input::placeholder {
			color: #9a958b;
		}

		.sliders {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 20px;
			padding: 18px 0 22px;
			border-top: 1px solid var(--line);
		}

		.slider-control {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 10px 14px;
			align-items: center;
		}

		.slider-control input {
			grid-column: 1 / -1;
			width: 100%;
			accent-color: var(--teal);
			cursor: pointer;
		}

		.slider-value {
			color: var(--teal);
			font: 700 13px 'Trebuchet MS', sans-serif;
		}

		.actions {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			align-items: center;
		}

		.forge-actions {
			margin: -4px 0 22px;
		}

		button {
			min-height: 42px;
		}

		.primary {
			color: #fff;
			background: var(--teal);
		}

		.primary:hover {
			background: #095c59;
		}

		button:disabled {
			cursor: wait;
			opacity: .65;
		}

		.result {
			position: relative;
			min-height: 150px;
			margin-top: 27px;
			padding: 22px 24px;
			background: #edf2e8;
			border-left: 3px solid var(--gold);
		}

		.result-top {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 12px;
		}

		.result-top .eyebrow {
			margin: 0;
		}

		.result-word {
			margin: 14px 0 12px;
			overflow-wrap: anywhere;
			font-size: clamp(28px, 5vw, 42px);
			line-height: 1.12;
		}

		.result-source {
			margin: 0;
			color: var(--muted);
			font: 14px/1.5 'Trebuchet MS', sans-serif;
		}

		.result-source strong {
			color: var(--ink);
			font-weight: 700;
		}

		.dictionary-save {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			gap: 10px 14px;
			align-items: end;
			margin-top: 16px;
			padding: 17px 18px;
			background: #f3eadc;
			border: 1px solid var(--line);
		}

		.dictionary-save .eyebrow {
			grid-column: 1 / -1;
		}

		.dictionary-save .field {
			gap: 7px;
		}

		.icon-button {
			min-width: 40px;
			width: 40px;
			min-height: 40px;
			height: 40px;
			padding: 8px;
			display: inline-grid;
			place-items: center;
			background: transparent;
			border: 1px solid var(--line);
		}

		.icon-button svg {
			width: 18px;
			height: 18px;
			fill: none;
			stroke: currentColor;
			stroke-linecap: round;
			stroke-linejoin: round;
			stroke-width: 1.8;
		}

		.icon-button:hover {
			background: #fffdf8;
			border-color: var(--teal);
		}

		.status {
			min-height: 20px;
			margin: 12px 0 0;
			color: var(--muted);
			font: 13px/1.5 'Trebuchet MS', sans-serif;
		}

		.status.error {
			color: #a63e34;
		}

		.dictionary {
			padding: 22px;
		}

		.dictionary-head {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			gap: 12px;
			margin-bottom: 18px;
		}

		.entry-count {
			color: var(--muted);
			font: 12px 'Trebuchet MS', sans-serif;
		}

		.dictionary-tools {
			display: grid;
			gap: 12px;
		}

		.dictionary-tools label {
			display: grid;
			gap: 7px;
		}

		.dictionary-tools select,
		.dictionary-tools input {
			min-height: 40px;
			font-size: 14px;
		}

		.dictionary-actions {
			display: flex;
			gap: 8px;
		}

		.dictionary-actions button {
			flex: 1;
			padding: 9px 10px;
			font-size: 12px;
		}

		.entries {
			display: grid;
			gap: 0;
			max-height: 420px;
			overflow: auto;
			margin-top: 18px;
			border-top: 1px solid var(--line);
		}

		.entry {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 32px;
			gap: 8px;
			align-items: center;
			padding: 13px 0;
			border-bottom: 1px solid var(--line);
		}

		.entry-word {
			display: block;
			overflow-wrap: anywhere;
			font-size: 18px;
			line-height: 1.25;
		}

		.entry-meaning {
			display: block;
			margin-top: 4px;
			color: var(--muted);
			font: 12px/1.4 'Trebuchet MS', sans-serif;
		}

		.entry-delete {
			width: 32px;
			min-width: 32px;
			min-height: 32px;
			height: 32px;
			padding: 6px;
			color: #8e5148;
			background: transparent;
		}

		.empty-state {
			margin: 17px 0 2px;
			color: var(--muted);
			font: 13px/1.5 'Trebuchet MS', sans-serif;
		}

		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		.dictionary-tools input.visually-hidden {
			width: 1px;
			min-width: 1px;
			min-height: 1px;
			padding: 0;
		}

		@media (max-width: 820px) {
			.workbench {
				grid-template-columns: 1fr;
			}

			.dictionary {
				order: 2;
			}

			.entries {
				max-height: 340px;
			}
		}

		@media (max-width: 560px) {
			.page-heading {
				align-items: flex-start;
				flex-direction: column;
				gap: 12px;
			}

			.fields,
			.sliders {
				grid-template-columns: 1fr;
			}

			.section-head {
				align-items: flex-start;
				flex-direction: column;
				gap: 6px;
			}

			.dictionary-save {
				grid-template-columns: 1fr;
			}

			.dictionary-save .eyebrow {
				grid-column: auto;
			}
		}
	</style>
</head>

<body>
	<div class="shell">
		<main>
			<section class="page-heading" aria-labelledby="page-title">
				<div>
					<h1 id="page-title">Language Forge</h1>
				</div>
				<p>Give a place, person, or phrase a second life: translate it, then shape the sound into something from your world.</p>
			</section>

			<div class="workbench">
				<section class="generator" aria-labelledby="generator-title">
					<div class="section-head">
						<h2 id="generator-title">Forge a name</h2>
						<span>Translation + transformation</span>
					</div>

					<form id="generator-form">
						<div class="fields">
							<div class="field">
								<label for="source-language">Real-world language</label>
								<select id="source-language" required></select>
							</div>
							<div class="field">
								<label for="english-input">English name or expression</label>
								<input id="english-input" type="text" maxlength="120" placeholder="e.g. Mine of Death" required autocomplete="off">
							</div>
						</div>
						<div class="actions forge-actions">
							<button class="primary" id="generate-button" type="submit">Translate &amp; forge</button>
						</div>

						<div class="sliders" aria-label="Style settings for the generated name">
							<label class="slider-control" for="displacement">
								<span class="slider-label">Letter displacement</span>
								<output class="slider-value" id="displacement-value" for="displacement">24%</output>
								<input id="displacement" type="range" min="0" max="100" value="24">
							</label>
							<label class="slider-control" for="ornamentation">
								<span class="slider-label">Apostrophes &amp; marks</span>
								<output class="slider-value" id="ornamentation-value" for="ornamentation">18%</output>
								<input id="ornamentation" type="range" min="0" max="100" value="18">
							</label>
						</div>
					</form>

					<div class="result" aria-live="polite" aria-atomic="true">
						<div class="result-top">
							<span class="eyebrow" id="result-language">Your forged name</span>
							<button class="icon-button" id="regenerate-button" type="button" aria-label="Regenerate spelling" title="Regenerate spelling" disabled>
								<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"></path><path d="M4 17v-5h5"></path><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12"></path><path d="M4 12l2.8 5a7 7 0 0 0 11.6-2"></path></svg>
							</button>
						</div>
						<p class="result-word" id="result-word">Your new name will appear here</p>
						<p class="result-source" id="result-source">Enter an English name or expression to begin.</p>
					</div>
					<section class="dictionary-save" aria-labelledby="save-title">
						<div class="field">
							<label for="dnd-language">D&amp;D language</label>
							<select id="dnd-language" required></select>
						</div>
						<button class="ghost" id="save-button" type="button" disabled>+ Add to dictionary</button>
					</section>
					<p class="status" id="status" role="status"></p>
				</section>

				<aside class="dictionary" aria-labelledby="dictionary-title">
					<div class="dictionary-head">
						<h2 id="dictionary-title">Dictionary</h2>
						<span class="entry-count" id="entry-count">0 entries</span>
					</div>
					<div class="dictionary-tools">
						<label for="dictionary-filter">Show language
							<select id="dictionary-filter"></select>
						</label>
						<label for="dictionary-search">Find a word
							<input id="dictionary-search" type="search" placeholder="Search words or meanings">
						</label>
						<div class="dictionary-actions">
							<button class="ghost" id="export-button" type="button" title="Export dictionary as JSON">Export</button>
							<button class="ghost" id="import-button" type="button" title="Import a dictionary JSON file">Import</button>
							<input class="visually-hidden" id="import-file" type="file" accept=".json,application/json">
						</div>
					</div>
					<div class="entries" id="entries" aria-live="polite"></div>
				</aside>
			</div>
		</main>
	</div>

	<script>
		(() => {
			const DND_LANGUAGES = [
				'Abyssal', 'Aquan', 'Auran', 'Celestial', 'Common', 'Deep Speech', 'Draconic',
				'Druidic', 'Dwarvish', 'Elvish', 'Giant', 'Gnomish', 'Goblin', 'Halfling',
				'Ignan', 'Infernal', 'Orc', 'Primordial', 'Sylvan', 'Terran', "Thieves' Cant", 'Undercommon'
			];
			const REAL_LANGUAGES = [
				{ name: 'Albanian', code: 'sq' }, { name: 'Croatian', code: 'hr' },
				{ name: 'Czech', code: 'cs' }, { name: 'Danish', code: 'da' },
				{ name: 'Dutch', code: 'nl' }, { name: 'Estonian', code: 'et' },
				{ name: 'Finnish', code: 'fi' }, { name: 'French', code: 'fr' },
				{ name: 'German', code: 'de' }, { name: 'Hungarian', code: 'hu' },
				{ name: 'Icelandic', code: 'is' }, { name: 'Indonesian', code: 'id' },
				{ name: 'Irish', code: 'ga' }, { name: 'Italian', code: 'it' },
				{ name: 'Latin', code: 'la' }, { name: 'Norwegian', code: 'no' },
				{ name: 'Polish', code: 'pl' }, { name: 'Portuguese', code: 'pt' },
				{ name: 'Romanian', code: 'ro' }, { name: 'Slovak', code: 'sk' },
				{ name: 'Spanish', code: 'es' }, { name: 'Swahili', code: 'sw' },
				{ name: 'Swedish', code: 'sv' }, { name: 'Turkish', code: 'tr' },
				{ name: 'Vietnamese', code: 'vi' }, { name: 'Welsh', code: 'cy' }
			];
			const STORAGE_KEY = 'soloDndLanguageForge.v1';
			const DEFAULT_SETTINGS = { displacement: 24, ornamentation: 18 };
			const state = loadState();
			let currentTranslation = null;
			let currentOutput = '';

			const $ = (id) => document.getElementById(id);
			const form = $('generator-form');
			const dndSelect = $('dnd-language');
			const sourceSelect = $('source-language');
			const displacement = $('displacement');
			const ornamentation = $('ornamentation');

			function loadState() {
				try {
					const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
					return {
						entries: Array.isArray(saved.entries) ? saved.entries.filter(isValidEntry) : [],
						settings: saved.settings && typeof saved.settings === 'object' ? saved.settings : {}
					};
				} catch {
					return { entries: [], settings: {} };
				}
			}

			function isValidEntry(entry) {
				return entry && typeof entry.english === 'string' && typeof entry.generated === 'string' &&
					typeof entry.dndLanguage === 'string' && typeof entry.sourceLanguage === 'string';
			}

			function persist() {
				try {
					localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
					return true;
				} catch {
					setStatus('Could not save in this browser. Check available local storage.', true);
					return false;
				}
			}

			function populateSelects() {
				dndSelect.innerHTML = DND_LANGUAGES.map((language) => `<option>${escapeHtml(language)}</option>`).join('');
				sourceSelect.innerHTML = REAL_LANGUAGES.map(({ name }) => `<option>${escapeHtml(name)}</option>`).join('');
				$('dictionary-filter').innerHTML = '<option value="">All languages</option>' +
					DND_LANGUAGES.map((language) => `<option>${escapeHtml(language)}</option>`).join('');
			}

			function escapeHtml(value) {
				return String(value).replace(/[&<>"']/g, (character) => ({
					'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
				})[character]);
			}

			function setStatus(message, isError = false) {
				$('status').textContent = message;
				$('status').classList.toggle('error', isError);
			}

			function settingsFor() {
				const legacyLanguage = DND_LANGUAGES.find((language) => state.settings[language]);
				const settings = state.settings.global || state.settings[legacyLanguage] || DEFAULT_SETTINGS;
				return {
					displacement: clamp(settings.displacement, 0, 100),
					ornamentation: clamp(settings.ornamentation, 0, 100)
				};
			}

			function clamp(value, min, max) {
				const number = Number(value);
				return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : min;
			}

			function loadSettings() {
				const settings = settingsFor();
				displacement.value = settings.displacement;
				ornamentation.value = settings.ornamentation;
				$('displacement-value').value = `${settings.displacement}%`;
				$('ornamentation-value').value = `${settings.ornamentation}%`;
			}

			function saveSettings() {
				state.settings.global = {
					displacement: Number(displacement.value),
					ornamentation: Number(ornamentation.value)
				};
				$('displacement-value').value = `${displacement.value}%`;
				$('ornamentation-value').value = `${ornamentation.value}%`;
				persist();
			}

			function languageCode(name) {
				return REAL_LANGUAGES.find((language) => language.name === name)?.code;
			}

			async function translate(text, language) {
				const code = languageCode(language);
				const url = new URL('https://api.mymemory.translated.net/get');
				url.searchParams.set('q', text);
				url.searchParams.set('langpair', `en|${code}`);
				const response = await fetch(url);
				if (!response.ok) throw new Error('The translation service could not be reached. Try again in a moment.');
				const data = await response.json();
				const translated = data?.responseData?.translatedText;
				if (data?.responseStatus !== 200 || typeof translated !== 'string' || !translated.trim()) {
					throw new Error(data?.responseDetails || 'No translation was returned for that phrase.');
				}
				return translated.trim();
			}

			function forge(text) {
				const { displacement: shuffle, ornamentation: marks } = settingsFor();
				const accentMap = {
					a: ['á', 'à', 'ä', 'å'], e: ['é', 'è', 'ë'], i: ['í', 'ì', 'ï'],
					o: ['ó', 'ò', 'ö'], u: ['ú', 'ù', 'ü'], c: ['ç', 'ć'], n: ['ñ', 'ń']
				};
				return text.replace(/[\p{L}\p{M}]+/gu, (word) => {
					const letters = Array.from(word);
					const movable = letters.map((letter, index) => /\p{L}/u.test(letter) ? index : -1).filter((index) => index >= 0);
					const swaps = Math.round((movable.length * shuffle) / 100 * 0.7);
					for (let step = 0; step < swaps && movable.length > 1; step++) {
						const position = Math.floor(Math.random() * (movable.length - 1));
						const left = movable[position];
						const right = movable[position + 1];
						[letters[left], letters[right]] = [letters[right], letters[left]];
					}
					for (const index of movable) {
						const letter = letters[index];
						const options = accentMap[letter.toLowerCase()];
						if (options && Math.random() < marks / 170) {
							const accent = options[Math.floor(Math.random() * options.length)];
							letters[index] = letter === letter.toUpperCase() ? accent.toUpperCase() : accent;
						}
					}
					let result = letters.join('');
					const separatorChance = marks / 420;
					if (result.length > 4 && Math.random() < separatorChance) {
						const splitAt = 1 + Math.floor(Math.random() * (result.length - 2));
						result = `${result.slice(0, splitAt)}'${result.slice(splitAt)}`;
					}
					return result;
				});
			}

			function renderResult() {
				if (!currentTranslation) return;
				currentOutput = forge(currentTranslation.translated);
				$('result-language').textContent = `${currentTranslation.sourceLanguage} translation`;
				$('result-word').textContent = currentOutput;
				$('result-source').innerHTML = `<strong>${escapeHtml(currentTranslation.translated)}</strong> · translated from “${escapeHtml(currentTranslation.english)}”`;
				$('regenerate-button').disabled = false;
				$('save-button').disabled = false;
			}

			form.addEventListener('submit', async (event) => {
				event.preventDefault();
				const english = $('english-input').value.trim();
				if (!english) return;
				const button = $('generate-button');
				button.disabled = true;
				$('regenerate-button').disabled = true;
				$('save-button').disabled = true;
				setStatus(`Translating into ${sourceSelect.value}…`);
				try {
					const translated = await translate(english, sourceSelect.value);
					currentTranslation = {
						english,
						translated,
						sourceLanguage: sourceSelect.value
					};
					renderResult();
					setStatus('Translation ready. Regenerate for another variation, or add it to your dictionary.');
				} catch (error) {
					setStatus(error.message || 'Translation failed. Check your connection and try again.', true);
				} finally {
					button.disabled = false;
				}
			});

			$('regenerate-button').addEventListener('click', renderResult);

			$('save-button').addEventListener('click', () => {
				if (!currentTranslation || !currentOutput) return;
				const entry = {
					id: typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
					...currentTranslation,
					dndLanguage: dndSelect.value,
					generated: currentOutput,
					createdAt: new Date().toISOString()
				};
				state.entries.unshift(entry);
				if (persist()) {
					renderDictionary();
					setStatus(`“${currentOutput}” added to the ${dndSelect.value} dictionary.`);
				}
			});

			function renderDictionary() {
				const language = $('dictionary-filter').value;
				const query = $('dictionary-search').value.trim().toLocaleLowerCase();
				const filtered = state.entries.filter((entry) => (!language || entry.dndLanguage === language) &&
					(!query || `${entry.generated} ${entry.english} ${entry.translated || ''}`.toLocaleLowerCase().includes(query)));
				$('entry-count').textContent = `${state.entries.length} ${state.entries.length === 1 ? 'entry' : 'entries'}`;
				$('entries').innerHTML = filtered.length ? filtered.map((entry) => `
					<article class="entry">
						<div><span class="entry-word">${escapeHtml(entry.generated)}</span>
						<span class="entry-meaning">${escapeHtml(entry.english)} · ${escapeHtml(entry.sourceLanguage)} · ${escapeHtml(entry.dndLanguage)}</span></div>
						<button class="entry-delete" type="button" data-delete="${escapeHtml(entry.id || '')}" aria-label="Remove ${escapeHtml(entry.generated)}" title="Remove entry">×</button>
					</article>`).join('') : '<p class="empty-state">No entries here yet. Forge a name and add it to your dictionary.</p>';
			}

			$('entries').addEventListener('click', (event) => {
				const button = event.target.closest('[data-delete]');
				if (!button) return;
				state.entries = state.entries.filter((entry) => String(entry.id || '') !== button.dataset.delete);
				persist();
				renderDictionary();
			});

			$('dictionary-filter').addEventListener('change', renderDictionary);
			$('dictionary-search').addEventListener('input', renderDictionary);
			displacement.addEventListener('input', saveSettings);
			ornamentation.addEventListener('input', saveSettings);

			$('export-button').addEventListener('click', () => {
				const blob = new Blob([JSON.stringify({ version: 1, entries: state.entries }, null, 2)], { type: 'application/json' });
				const link = document.createElement('a');
				link.href = URL.createObjectURL(blob);
				link.download = 'language-forge-dictionary.json';
				link.click();
				URL.revokeObjectURL(link.href);
			});

			$('import-button').addEventListener('click', () => $('import-file').click());
			$('import-file').addEventListener('change', async (event) => {
				const file = event.target.files?.[0];
				if (!file) return;
				try {
					const imported = JSON.parse(await file.text());
					const entries = Array.isArray(imported) ? imported : imported.entries;
					if (!Array.isArray(entries) || !entries.every(isValidEntry)) {
						throw new Error('That file does not look like a Language Forge dictionary.');
					}
					const knownIds = new Set(state.entries.map((entry) => entry.id).filter(Boolean));
					const additions = entries.map((entry) => ({ ...entry, id: entry.id || `${Date.now()}-${Math.random()}` }))
						.filter((entry) => !knownIds.has(entry.id));
					state.entries = [...additions, ...state.entries];
					if (persist()) {
						renderDictionary();
						setStatus(`Imported ${additions.length} ${additions.length === 1 ? 'entry' : 'entries'}.`);
					}
				} catch (error) {
					setStatus(error.message || 'Could not read that dictionary file.', true);
				} finally {
					event.target.value = '';
				}
			});

			populateSelects();
			loadSettings();
			renderDictionary();
		})();
	</script>
</body>

</html>
